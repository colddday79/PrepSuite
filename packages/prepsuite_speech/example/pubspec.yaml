name: prepsuite_speech_example
description: On-device test app for prepsuite_speech.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  prepsuite_speech:
    path: ../
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The model assets come from prepsuite_speech itself (its pubspec declares
  # the assets/models/ folders; create the files with tools/voice/fetch_models.sh).
