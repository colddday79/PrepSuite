name: prepsuite_speech
description: >-
  Offline speech for PrepSuite: streaming speech-to-text with word timings,
  delivery metrics, and the Norman (Piper) interviewer voice via sherpa-onnx.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  record: ^7.1.1
  sherpa_onnx: ^1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The offline models (about 135 MB, gitignored) are created by
  # tools/voice/fetch_models.sh. Folders, not files, are declared so fresh
  # clones and CI build without them: each folder is kept in git by a
  # placeholder, and SpeechModels.ensureReady() throws SpeechModelsMissing at
  # run time when manifest.json is absent. Apps get these assets automatically
  # under packages/prepsuite_speech/assets/models/.
  assets:
    - assets/models/
    - assets/models/asr/
    - assets/models/tts/
    - assets/models/tts/espeak-ng-data/
    - assets/models/tts/espeak-ng-data/lang/gmw/
