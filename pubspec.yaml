name: prepsuite
description: "PrepSuite: speak the job you want, answer real questions, get honest feedback."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_drawing: ^1.0.1
  permission_handler: ^12.0.1
  prepsuite_speech:
    path: packages/prepsuite_speech
  shared_preferences: ^2.5.5
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The offline speech models are declared by packages/prepsuite_speech itself
  # (as folders, so builds work before tools/voice/fetch_models.sh has run).
  assets:
    - assets/video/presence_loop.mp4
    - assets/video/presence_poster.jpg
    - assets/fonts/BodoniModa-OFL.txt
    - assets/fonts/Jost-OFL.txt
  fonts:
    # Both are variable fonts under the SIL Open Font License 1.1 (see the -OFL.txt files).
    - family: BodoniModa
      fonts:
        # Weight 400-900 and optical size 6-96. Headlines, questions and the wordmark.
        - asset: assets/fonts/BodoniModa.ttf
    - family: Jost
      fonts:
        # Weight 100-900. Everything you read or tap.
        - asset: assets/fonts/Jost.ttf
