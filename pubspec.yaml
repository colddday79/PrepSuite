name: prepsuite
description: "PrepSuite: speak the job you want, answer real questions, get honest feedback."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_drawing: ^1.0.1
  permission_handler: ^12.0.1
  prepsuite_speech:
    path: packages/prepsuite_speech
  shared_preferences: ^2.5.5
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The offline speech models are declared by packages/prepsuite_speech itself
  # (as folders, so builds work before tools/voice/fetch_models.sh has run).
  assets:
    - assets/video/presence_loop.mp4
    - assets/fonts/OFL.txt
  fonts:
    - family: MonaSans
      fonts:
        # Variable font (weight and width axes). SIL Open Font License 1.1,
        # see assets/fonts/OFL.txt.
        - asset: assets/fonts/MonaSans.ttf
